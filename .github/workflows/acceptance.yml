name: Vartul acceptance
on: [push, pull_request]
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VARTUL_AI_DISABLE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:docs
      # Contracts, service suites (seeds the six-month history and scene snapshots on first run), testnet simulation
      - run: pnpm test:acceptance
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:demo
      - run: git diff --check
