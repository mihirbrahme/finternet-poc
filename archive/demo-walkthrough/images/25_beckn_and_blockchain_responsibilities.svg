<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9" fill="none" stroke="#819677" stroke-width="1.5"/></marker></defs><rect width="1600" height="850" fill="#f5f7f0"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="80" y="80" fill="#6b805f" font-size="14" letter-spacing="3">TWO COMPLEMENTARY RESPONSIBILITIES</text><text x="80" y="140" fill="#233d34" font-size="43" font-weight="600">Beckn opens the interaction. The ledger enforces the commitment.</text>
<rect x="80" y="190" width="1440" height="220" rx="19" fill="#edf1fc" stroke="#d5dff4"/><text x="110" y="231" fill="#385caa" font-size="15" letter-spacing="2" font-weight="700">DISCOVERY &amp; INTERACTION</text>
<g fill="white" stroke="#d7dfef"><rect x="110" y="260" width="340" height="110" rx="13"/><rect x="570" y="260" width="390" height="110" rx="13"/><rect x="1080" y="260" width="410" height="110" rx="13"/></g>
<g fill="#304c7c" font-size="24" font-weight="600"><text x="135" y="304">Sponsor discovery interface</text><text x="595" y="304">Discoverable programme offering</text><text x="1105" y="304">Aamhi provider interface</text></g><g fill="#74839c" font-size="17"><text x="135" y="340">Funding intent and programme search</text><text x="595" y="340">Purpose · material · place · terms</text><text x="1105" y="340">Publishes the offering and its identity</text></g><g stroke="#819677" stroke-width="2" marker-end="url(#arrow)"><path d="M465 315H550"/><path d="M1065 315H980"/></g>
<path d="M790 417V470" stroke="#819677" stroke-width="2" marker-end="url(#arrow)"/><rect x="822" y="425" width="450" height="36" rx="8" fill="#f5f7f0"/><text x="835" y="449" fill="#6c7f5e" font-size="16">Offering reference → mutually accepted programme terms</text>
<rect x="80" y="485" width="1440" height="225" rx="19" fill="#eaf3e9" stroke="#d4e3ce"/><text x="110" y="527" fill="#26714f" font-size="15" letter-spacing="2" font-weight="700">SHARED COMMITMENTS &amp; SETTLEMENT</text><g fill="white" stroke="#d6e3cf"><rect x="110" y="555" width="395" height="112" rx="13"/><rect x="590" y="555" width="405" height="112" rx="13"/><rect x="1080" y="555" width="410" height="112" rx="13"/></g>
<g fill="#2c593b" font-size="24" font-weight="600"><text x="135" y="599">Commitment + escrow</text><text x="615" y="599">Receipt + verification</text><text x="1105" y="599">Automatic payment + attribution</text></g><g fill="#72866a" font-size="17"><text x="135" y="638">Accepted terms and reserved dINR</text><text x="615" y="638">Authorised assertions linked to evidence</text><text x="1105" y="638">Enforced conditions and one receipt</text></g><g stroke="#819677" stroke-width="2" marker-end="url(#arrow)"><path d="M520 612H570"/><path d="M1010 612H1060"/></g>
<text x="80" y="761" fill="#6d7f60" font-size="18">Evidence files stay off-chain. Their fingerprints connect the physical-work record to the programme.</text><text x="80" y="800" fill="#8a977f" font-size="14">Conceptual mapping · Current discovery uses a separate HTTP catalogue adapter. Full Beckn network integration remains a pilot task.</text></g></svg>
