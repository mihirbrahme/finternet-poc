<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10" fill="none" stroke="#819677" stroke-width="1.5"/></marker></defs>
<rect width="1600" height="850" fill="#f5f7f0"/><rect x="0" y="0" width="1600" height="14" fill="#234e3c"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="80" y="84" font-size="15" letter-spacing="3" fill="#6e805f">PROJECT AAMHI · FUNDING WITH A VISIBLE OUTCOME</text><text x="80" y="145" font-size="44" font-weight="600" fill="#233d34">From a promise of support to accountable progress.</text><text x="80" y="192" font-size="21" fill="#687b5e">Agree the purpose. Link the evidence. Verify the result. Let the conditions govern payment.</text>
<g fill="white" stroke="#dce4d3"><rect x="80" y="255" width="440" height="250" rx="19"/><rect x="580" y="255" width="440" height="250" rx="19"/><rect x="1080" y="255" width="440" height="250" rx="19"/></g>
<rect x="80" y="255" width="440" height="7" rx="3" fill="#385caa"/><rect x="580" y="255" width="440" height="7" rx="3" fill="#26714f"/><rect x="1080" y="255" width="440" height="7" rx="3" fill="#8052a0"/>
<g font-size="13" letter-spacing="2" font-weight="700"><text x="110" y="303" fill="#385caa">01 / SHARED COMMITMENT</text><text x="610" y="303" fill="#26714f">02 / ACCOUNTABLE WORK</text><text x="1110" y="303" fill="#8052a0">03 / PROGRAMMABLE SETTLEMENT</text></g>
<g fill="#243d33" font-size="27" font-weight="600"><text x="110" y="353">Sponsor + Aamhi</text><text x="610" y="353">Aamhi + facility + verifier</text><text x="1110" y="353">Contract-enforced payment</text></g>
<g fill="#6b7e61" font-size="19"><text x="110" y="396">Define the outcome and conditions.</text><text x="110" y="432">Accept the same terms.</text><text x="110" y="468">Deposit milestone funding upfront.</text><text x="610" y="396">Submit the collection evidence.</text><text x="610" y="432">Confirm receipt and quantity.</text><text x="610" y="468">Accept the eligible outcome.</text><text x="1110" y="396">Qualifying verification releases value.</text><text x="1110" y="432">Exceptions require both parties.</text><text x="1110" y="468">Payment + attribution share a receipt.</text></g>
<g stroke="#819677" stroke-width="2" marker-end="url(#arrow)"><path d="M531 380H564"/><path d="M1031 380H1064"/></g>
<rect x="80" y="550" width="1440" height="144" rx="18" fill="#eaf1e2"/><text x="110" y="594" fill="#4e6d42" font-size="14" letter-spacing="2" font-weight="700">THE SPONSOR'S RESULT</text><text x="110" y="637" fill="#294a32" font-size="25">A clear record of what the contribution supported, who confirmed it, and why payment moved.</text><text x="110" y="670" fill="#6b805e" font-size="18">Actual outcomes stay accurate—even when an agreed exception changes the financial response.</text>
<text x="80" y="755" fill="#677b5c" font-size="17">Finternet connects identity, discovery, digital commitments, attestations and programmable value across participants.</text><text x="80" y="793" fill="#8c987e" font-size="14">Conceptual diagram · The following screenshots show the corresponding executable programme journey.</text></g></svg>
