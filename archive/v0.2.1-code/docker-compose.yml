name: finternet-poc-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: finternet-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finternet_poc}
      POSTGRES_USER: ${POSTGRES_USER:-finternet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finternet}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: finternet-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-finternet}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-finternet-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: finternet-anvil
    entrypoint:
      - anvil
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8545"
      - --chain-id
      - "${CHAIN_ID:-31337}"
    ports:
      - "${ETHEREUM_RPC_PORT:-8545}:8545"

  mock-ipfs:
    image: ipfs/kubo:v0.30.0
    container_name: finternet-mock-ipfs
    ports:
      - "${IPFS_API_PORT:-5001}:5001"
      - "${IPFS_GATEWAY_PORT:-8080}:8080"
    volumes:
      - ipfs-data:/data/ipfs

volumes:
  postgres-data:
  minio-data:
  ipfs-data:
